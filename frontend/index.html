<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <h1>Member Management</h1>
    <p class="subtitle">Add, search, edit, and remove member records.</p>
  </header>

  <main>
    <!-- Add / Edit form -->
    <section class="panel" id="form-panel">
      <h2 id="form-title">Add member</h2>
      <form id="member-form">
        <input type="hidden" id="member-id">

        <div class="field-grid">
          <div class="field">
            <label for="firstname">First name</label>
            <input type="text" id="firstname" required maxlength="100">
          </div>
          <div class="field">
            <label for="lastname">Last name</label>
            <input type="text" id="lastname" required maxlength="100">
          </div>
          <div class="field">
            <label for="date_of_birth">Date of birth</label>
            <input type="date" id="date_of_birth" required>
          </div>
          <div class="field">
            <label for="father_name">Father's name</label>
            <input type="text" id="father_name" required maxlength="100">
          </div>
          <div class="field">
            <label for="mother_name">Mother's name</label>
            <input type="text" id="mother_name" required maxlength="100">
          </div>
          <div class="field">
            <label for="intercessor_name">Intercessor name</label>
            <input type="text" id="intercessor_name" required maxlength="100">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add member</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-ghost" hidden>Cancel</button>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
      </form>
    </section>

    <!-- Search -->
    <section class="panel">
      <h2>Search</h2>
      <div class="search-row">
        <input type="text" id="search-firstname" placeholder="First name">
        <input type="text" id="search-lastname" placeholder="Last name">
        <button type="button" id="search-btn" class="btn btn-primary">Search</button>
        <button type="button" id="clear-search-btn" class="btn btn-ghost">Clear</button>
      </div>
    </section>

    <!-- Member list -->
    <section class="panel">
      <div class="panel-header-row">
        <h2>Members</h2>
        <div class="panel-header-actions">
          <span class="count-badge" id="member-count">0</span>
          <button type="button" id="export-csv-btn" class="btn btn-ghost btn-small">Export CSV</button>
          <button type="button" id="import-csv-btn" class="btn btn-ghost btn-small">Import CSV</button>
          <input type="file" id="import-csv-input" accept=".csv" hidden>
        </div>
      </div>

      <div id="status-message" class="status-message" hidden></div>

      <div class="table-wrap">
        <table id="members-table">
          <thead>
            <tr>
              <th>First name</th>
              <th>Last name</th>
              <th>Date of birth</th>
              <th>Father's name</th>
              <th>Mother's name</th>
              <th>Intercessor</th>
              <th class="actions-col">Actions</th>
            </tr>
          </thead>
          <tbody id="members-tbody">
          </tbody>
        </table>
      </div>

      <p class="empty-state" id="empty-state" hidden>No members found. Add one above to get started.</p>
    </section>
  </main>

  <!-- Delete confirmation -->
  <div class="modal-overlay" id="delete-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <h3 id="delete-modal-title">Delete this member?</h3>
      <p id="delete-modal-text"></p>
      <div class="modal-actions">
        <button type="button" id="confirm-delete-btn" class="btn btn-danger">Delete</button>
        <button type="button" id="cancel-delete-btn" class="btn btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
