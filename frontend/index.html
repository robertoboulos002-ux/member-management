<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الأعضاء</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <h1>إدارة الأعضاء</h1>
    <p class="subtitle">إضافة الأعضاء والبحث عنهم وتعديل بياناتهم وحذفها.</p>
  </header>

  <main>
    <!-- Add / Edit form -->
    <section class="panel" id="form-panel">
      <h2 id="form-title">إضافة عضو</h2>
      <form id="member-form">
        <input type="hidden" id="member-id">

        <div class="field-grid">
          <div class="field">
            <label for="firstname">الاسم الأول</label>
            <input type="text" id="firstname" required maxlength="100">
          </div>
          <div class="field">
            <label for="lastname">اسم العائلة</label>
            <input type="text" id="lastname" required maxlength="100">
          </div>
          <div class="field">
            <label for="date_of_birth">تاريخ الميلاد</label>
            <input type="date" id="date_of_birth" required>
          </div>
          <div class="field">
            <label for="father_name">اسم الأب</label>
            <input type="text" id="father_name" required maxlength="100">
          </div>
          <div class="field">
            <label for="mother_name">اسم الأم</label>
            <input type="text" id="mother_name" required maxlength="100">
          </div>
          <div class="field">
            <label for="intercessor_name">اسم الشفيع</label>
            <input type="text" id="intercessor_name" required maxlength="100">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">إضافة عضو</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-ghost" hidden>إلغاء</button>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
      </form>
    </section>

    <!-- Search -->
    <section class="panel">
      <h2>بحث</h2>
      <div class="search-row">
        <input type="text" id="search-intercessor" placeholder="اسم الشفيع">
        <button type="button" id="search-btn" class="btn btn-primary">بحث</button>
        <button type="button" id="clear-search-btn" class="btn btn-ghost">مسح</button>
      </div>
    </section>

    <!-- Member list -->
    <section class="panel">
      <div class="panel-header-row">
        <h2>الأعضاء</h2>
        <div class="panel-header-actions">
          <span class="count-badge" id="member-count">0</span>
          <button type="button" id="export-csv-btn" class="btn btn-ghost btn-small">تصدير CSV</button>
          <button type="button" id="import-csv-btn" class="btn btn-ghost btn-small">استيراد CSV</button>
          <input type="file" id="import-csv-input" accept=".csv" hidden>
        </div>
      </div>

      <div id="status-message" class="status-message" hidden></div>

      <div class="table-wrap">
        <table id="members-table">
          <thead>
            <tr>
              <th>الاسم الأول</th>
              <th>اسم العائلة</th>
              <th>تاريخ الميلاد</th>
              <th>اسم الأب</th>
              <th>اسم الأم</th>
              <th>الشفيع</th>
              <th class="actions-col">الإجراءات</th>
            </tr>
          </thead>
          <tbody id="members-tbody">
          </tbody>
        </table>
      </div>

      <p class="empty-state" id="empty-state" hidden>لا يوجد أعضاء. أضف عضوًا من الأعلى للبدء.</p>
    </section>
  </main>

  <!-- Delete confirmation -->
  <div class="modal-overlay" id="delete-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <h3 id="delete-modal-title">حذف هذا العضو؟</h3>
      <p id="delete-modal-text"></p>
      <div class="modal-actions">
        <button type="button" id="confirm-delete-btn" class="btn btn-danger">حذف</button>
        <button type="button" id="cancel-delete-btn" class="btn btn-ghost">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
